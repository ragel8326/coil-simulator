<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gradient Coil Bench - two air-core coils, linear 25 to 10 Oe field gradient.">
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0
    }

    [hidden] {
      display: none !important
    }
  </style>
  <title>Gradient Coil Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <style>
    :root {
      --ground: #FBFAF7;
      --surface: #FFF;
      --sunk: #F3F0EA;
      --line: #E2DCD2;
      --line2: #EFEAE1;
      --ink: #1B1A18;
      --ink2: #4A443C;
      --muted: #7A736A;
      --accent: #B05A2A;
      --blue: #1F5FA8;
      --meas: #B05A2A;
      --good: #2E6B34;
      --bad: #A8342A;
      --mono: "IBM Plex Mono", Menlo, monospace;
      --sans: "IBM Plex Sans", -apple-system, "Apple SD Gothic Neo", sans-serif;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --ground: #15161A;
        --surface: #1D1F24;
        --sunk: #25282E;
        --line: #31353D;
        --line2: #272A31;
        --ink: #ECEAE5;
        --ink2: #C3BEB6;
        --muted: #948E85;
        --accent: #D08A55;
        --blue: #4B8FD6;
        --meas: #C87340;
        --good: #7FC08A;
        --bad: #E08A80;
      }
    }

    :root[data-theme="dark"] {
      --ground: #15161A;
      --surface: #1D1F24;
      --sunk: #25282E;
      --line: #31353D;
      --line2: #272A31;
      --ink: #ECEAE5;
      --ink2: #C3BEB6;
      --muted: #948E85;
      --accent: #D08A55;
      --blue: #4B8FD6;
      --meas: #C87340;
      --good: #7FC08A;
      --bad: #E08A80;
    }

    * {
      box-sizing: border-box
    }

    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.5;
      margin: 0;
      padding-block: 22px 44px;
      padding-left: 18px;
      padding-right: 18px
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 18px
    }

    h1 {
      font-size: 19px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -.01em
    }

    h1 span {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 10px
    }

    .tb {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--surface);
      color: var(--ink2);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer
    }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 18px;
      align-items: start
    }

    @media (max-width:960px) {
      .layout {
        grid-template-columns: 1fr
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px
    }

    .panel>h2 {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line2);
      font-weight: 500
    }

    .pb {
      padding: 12px
    }

    .rail {
      position: sticky;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    @media (max-width:960px) {
      .rail {
        position: static
      }
    }

    .grp {
      border-top: 1px solid var(--line2);
      padding-top: 10px;
      margin-top: 10px
    }

    .grp:first-child {
      border-top: 0;
      padding-top: 0;
      margin-top: 0
    }

    .grp b {
      font-size: 12px;
      display: block;
      margin-bottom: 7px
    }

    .grp b i {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      display: inline-block;
      margin-right: 6px;
      font-style: normal
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px
    }

    .f {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0
    }

    .f.full {
      grid-column: 1/-1
    }

    label {
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    input,
    select,
    textarea {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--sunk);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 7px;
      width: 100%;
      font-variant-numeric: tabular-nums
    }

    input[readonly] {
      opacity: .65
    }

    textarea {
      font-size: 12px;
      resize: vertical
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden
    }

    .seg button {
      flex: 1;
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 2px;
      background: var(--sunk);
      color: var(--muted);
      border: 0;
      border-right: 1px solid var(--line);
      cursor: pointer
    }

    .seg button:last-child {
      border-right: 0
    }

    .seg button[aria-pressed=true] {
      background: var(--accent);
      color: #fff
    }

    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap
    }

    .tabs button {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      background: none;
      border: 0;
      color: var(--muted);
      padding: 9px 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px
    }

    .tabs button[aria-selected=true] {
      color: var(--ink);
      border-bottom-color: var(--accent)
    }

    svg.chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .chart text {
      font-family: var(--mono);
      font-size: 10px;
      fill: var(--muted);
      font-variant-numeric: tabular-nums
    }

    .cbox {
      position: relative;
      padding: 12px 12px 2px
    }

    .tip {
      position: absolute;
      pointer-events: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: var(--mono);
      font-size: 11px;
      opacity: 0;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 14px;
      padding: 2px 14px 12px;
      font-size: 11px;
      color: var(--ink2)
    }

    .legend i {
      width: 15px;
      height: 0;
      border-top-width: 2.5px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: 4px
    }

    .kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      border-top: 1px solid var(--line2)
    }

    .kpi>div {
      padding: 9px 12px;
      border-right: 1px solid var(--line2);
      border-bottom: 1px solid var(--line2)
    }

    .kpi .k {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px
    }

    .kpi .v {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em
    }

    .kpi .v s {
      text-decoration: none;
      font-size: 10.5px;
      color: var(--muted);
      margin-left: 3px
    }

    .kpi .v.ok {
      color: var(--good)
    }

    .kpi .v.bad {
      color: var(--bad)
    }

    .kpi .v.hi {
      color: var(--accent)
    }

    table.t {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums
    }

    table.t th {
      text-align: right;
      font-weight: 500;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .03em;
      text-transform: uppercase;
      padding: 6px 9px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    table.t td {
      padding: 5px 9px;
      border-bottom: 1px solid var(--line2);
      text-align: right;
      white-space: nowrap
    }

    table.t th:first-child,
    table.t td:first-child {
      text-align: left
    }

    .scroll {
      overflow-x: auto
    }

    button.act {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 7px 13px;
      cursor: pointer
    }

    button.act[disabled] {
      opacity: .45;
      cursor: default
    }

    button.gh {
      background: var(--surface);
      color: var(--ink2);
      border: 1px solid var(--line)
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end
    }

    .bar {
      height: 4px;
      background: var(--sunk);
      border-radius: 2px;
      flex: 1;
      min-width: 90px;
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0
    }

    pre.log {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink2);
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px;
      margin: 10px 0 0;
      white-space: pre-wrap;
      min-height: 56px
    }

    .og {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px
    }

    .og th {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .03em;
      font-weight: 500;
      padding: 5px 6px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    .og td {
      padding: 4px 6px;
      border-bottom: 1px solid var(--line2)
    }

    .og input {
      padding: 3px 5px;
      font-size: 11.5px
    }

    .note {
      font-size: 11px;
      color: var(--muted)
    }

    footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.7
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Gradient Coil Bench <span>H(x) = N·I·r² / 2(r²+x²)^{3/2} &nbsp;·&nbsp; 1 Oe = 79.5775 A/m</span></h1>
      <button class="tb" id="tb" type="button">Theme</button>
    </header>

    <div class="layout">
      <aside class="rail">
        <section class="panel">
          <h2>Input</h2>
          <div class="pb">

            <div class="grp">
              <div class="fields">
                <div class="f"><label for="cur">Current I (A)</label>
                  <input type="number" id="cur" value="1" step="0.05" min="0.01">
                </div>
                <div class="f"><label for="dw">Wire dia (mm)</label>
                  <select id="dw">
                    <option>0.3</option>
                    <option>0.4</option>
                    <option selected>0.5</option>
                  </select>
                </div>
                <div class="f"><label for="dist">Separation d (mm)</label>
                  <input type="number" id="dist" value="82.5" step="0.5">
                </div>
                <div class="f"><label for="pmax">Power limit (W)</label>
                  <input type="number" id="pmax" value="10" step="0.5" min="0.1">
                </div>
                <div class="f full"><label for="mode">Turns</label>
                  <select id="mode">
                    <option value="free" selected>Enter N directly</option>
                    <option value="lock">Set N from each coil's own target field</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="grp">
              <b><i style="background:var(--blue)"></i>Coil 1</b>
              <div class="fields">
                <div class="f"><label for="r1">Radius r₁ (mm)</label><input type="number" id="r1" value="69.1"
                    step="0.1"></div>
                <div class="f"><label for="n1">Turns N₁</label><input type="number" id="n1" value="260" step="1"
                    min="1"></div>
                <div class="f full"><label>Direction</label>
                  <div class="seg" id="d1"><button type="button" data-v="1" aria-pressed="true">Forward
                      +</button><button type="button" data-v="-1" aria-pressed="false">Reverse −</button></div>
                </div>
              </div>
            </div>

            <div class="grp">
              <b><i style="background:var(--accent)"></i>Coil 2</b>
              <div class="fields">
                <div class="f"><label for="r2">Radius r₂ (mm)</label><input type="number" id="r2" value="49.1"
                    step="0.1"></div>
                <div class="f"><label for="n2">Turns N₂</label><input type="number" id="n2" value="35" step="1" min="1">
                </div>
                <div class="f full"><label>Direction</label>
                  <div class="seg" id="d2"><button type="button" data-v="1" aria-pressed="true">Forward
                      +</button><button type="button" data-v="-1" aria-pressed="false">Reverse −</button></div>
                </div>
              </div>
            </div>

            <div class="grp">
              <b>Target</b>
              <div class="fields">
                <div class="f"><label for="h1">H at x = 0 (Oe)</label><input type="number" id="h1" value="25"
                    step="0.5"></div>
                <div class="f"><label for="h2">H at x = d (Oe)</label><input type="number" id="h2" value="10"
                    step="0.5"></div>
              </div>
            </div>

          </div>
        </section>
      </aside>

      <main>
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-t="calc">Calculate</button>
          <button role="tab" aria-selected="false" data-t="opt">Optimize</button>
          <button role="tab" aria-selected="false" data-t="sens">Sensitivity</button>
          <button role="tab" aria-selected="false" data-t="meas">Measurements</button>
        </div>

        <section id="t-calc">
          <div class="panel" style="border-top:0;border-radius:0 0 6px 6px">
            <div class="cbox">
              <svg class="chart" id="ch" viewBox="0 0 760 300" role="img" aria-label="Field versus distance"></svg>
              <div class="tip" id="tip"></div>
            </div>
            <div class="legend" id="lg"></div>
            <div class="kpi" id="kpi"></div>
          </div>
          <div class="panel" style="margin-top:12px">
            <h2>Profile</h2>
            <div class="scroll">
              <table class="t" id="prof"></table>
            </div>
          </div>
          <div class="panel" style="margin-top:12px">
            <div class="pb row">
              <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="sep" style="width:auto"> Show
                each coil separately</label>
              <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="shm" checked
                  style="width:auto"> Show measurements</label>
              <button class="act gh" type="button" id="cps">Copy summary</button>
              <button class="act gh" type="button" id="cpt">Copy profile</button>
            </div>
          </div>
        </section>

        <section id="t-opt" hidden>
          <div class="panel" style="border-top:0;border-radius:0 0 6px 6px">
            <div class="pb">
              <div class="scroll">
                <table class="og" id="ov">
                  <thead>
                    <tr>
                      <th>Variable</th>
                      <th>Search</th>
                      <th>Min</th>
                      <th>Max</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:12px">
                <div class="f"><label for="obj">Objective</label>
                  <select id="obj">
                    <option value="max">Max deviation</option>
                    <option value="mse">MSE</option>
                  </select>
                </div>
                <div class="f"><label for="gens">Generations</label><input type="number" id="gens" value="200" step="20"
                    min="20"></div>
                <div class="f"><label for="dsel">Coil 2 direction</label>
                  <select id="dsel">
                    <option value="auto" selected>Auto</option>
                    <option value="keep">Keep</option>
                  </select>
                </div>
              </div>
              <div class="row" style="margin-top:12px">
                <button class="act" type="button" id="run">Run</button>
                <button class="act gh" type="button" id="app" disabled>Apply</button>
                <div class="bar"><i id="pb"></i></div>
              </div>
              <pre class="log" id="log">Idle.</pre>
            </div>
          </div>
        </section>

        <section id="t-sens" hidden>
          <div class="panel" style="border-top:0;border-radius:0 0 6px 6px">
            <div class="pb">
              <div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
                <div class="f"><label for="tr">Δr (mm)</label><input type="number" id="tr" value="0.5" step="0.1"></div>
                <div class="f"><label for="tn">ΔN (turns)</label><input type="number" id="tn" value="1" step="1"></div>
                <div class="f"><label for="td">Δd (mm)</label><input type="number" id="td" value="1" step="0.1"></div>
                <div class="f"><label for="ti">ΔI (%)</label><input type="number" id="ti" value="1" step="0.1"></div>
                <div class="f"><label for="tx">Δx probe (mm)</label><input type="number" id="tx" value="0.5" step="0.1">
                </div>
              </div>
              <div class="scroll" style="margin-top:12px">
                <table class="t" id="st"></table>
              </div>
            </div>
          </div>
        </section>

        <section id="t-meas" hidden>
          <div class="panel" style="border-top:0;border-radius:0 0 6px 6px">
            <div class="pb">
              <label for="raw">x(mm), reading1, reading2, reading3 …</label>
              <textarea id="raw" rows="8" spellcheck="false">0.0, 23.44, 23.43, 23.46
10.3, 22.98, 22.94, 22.98
20.6, 21.28, 21.39, 21.27
30.9, 18.95, 18.83, 19.00
41.2, 16.50, 16.53, 16.52
51.6, 14.45, 14.51, 14.49
61.9, 12.96, 12.98, 12.89
72.2, 11.77, 11.61, 11.70
82.5, 10.52, 10.48, 10.40</textarea>
              <div class="row" style="margin-top:9px">
                <button class="act" type="button" id="pr">Compute</button>
                <button class="act gh" type="button" id="cl">Clear</button>
                <span class="note" id="dn"></span>
              </div>
              <div class="kpi" id="mk" style="margin-top:12px;border-top:1px solid var(--line2)"></div>
              <div class="scroll" style="margin-top:12px">
                <table class="t" id="mt"></table>
              </div>
            </div>
          </div>
          <div class="panel" style="margin-top:12px">
            <h2>Nonlinear least squares (Levenberg–Marquardt)</h2>
            <div class="pb">
              <div class="row">
                <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="fk" checked
                    style="width:auto"> Amplitude k</label>
                <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="fx" style="width:auto">
                  Probe zero x₀</label>
                <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="fr1" checked
                    style="width:auto"> r₁</label>
                <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="fd" style="width:auto">
                  d</label>
                <label class="row" style="gap:5px;font-size:12px"><input type="checkbox" id="fw" checked
                    style="width:auto"> Weight 1/σ²</label>
                <button class="act" type="button" id="rf">Fit</button>
                <button class="act gh" type="button" id="cf">Clear</button>
              </div>
              <div class="scroll" style="margin-top:12px">
                <table class="t" id="ft"></table>
              </div>
              <p class="note" id="fn" style="margin-top:9px"></p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    "use strict";
    const OE = 79.5774715459, RHO = 1.68e-8;
    const $ = id => document.getElementById(id);
    const fmt = (v, d = 2) => isFinite(v) ? v.toFixed(d) : "—";
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

    /* ---- model ---- */
    const Hc = (x, N, r, I) => 0.5 * I * N * r * r / Math.pow(r * r + x * x, 1.5) / OE;   // Oe
    const wireLen = (N, r) => N * 2 * Math.PI * r;
    const res = (L, dw) => RHO * L / (Math.PI * (dw / 2) * (dw / 2));

    const dir = { 1: 1, 2: 1 };
    function read() {
      const S = {
        I: +$("cur").value || 1, dw: +$("dw").value / 1000, d: +$("dist").value / 1000,
        pmax: +$("pmax").value || 10, mode: $("mode").value,
        r1: +$("r1").value / 1000, r2: +$("r2").value / 1000,
        N1: Math.max(1, Math.round(+$("n1").value)), N2: Math.max(1, Math.round(+$("n2").value)),
        s1: dir[1], s2: dir[2], h1: +$("h1").value, h2: +$("h2").value

      if (S.mode === "lock") {

        S.N2 = Math.max(1, Math.round(2 * S.r2 * S.h2 * OE / S.I));

    function evalS(S, NP = 101) {

        const a = S.s1 * Hc(x, S.N1, S.r1, S.I), b = S.s2 * Hc(S.d - x, S.N2, S.r2, S.I);

      let t = el("text", { x: p.l + pw / 2, y: H - 5, "text-anchor": "middle" }); t.textContent = "x (mm)"; svg.appendChild(t);
      t = el("text", { x: 13, y: p.t + ph / 2, "text-anchor": "middle", transform: `rotate(-90 13 ${p.t + ph / 2})` });
      t.textContent = "H (Oe)"; svg.appendChild(t);

        svg.appendChild(el("path", { d: dd, fill: "none", stroke: ca, "stroke-width": 1.8, "stroke-dasharray": "7 4" }));

        const px = X(xm / 1000), py = Y(meas.mean[i]), sd = meas.sd[i];

          [-1, 1].forEach(s => svg.appendChild(el("line", { x1: px - 3, x2: px + 3, y1: Y(meas.mean[i] + s * sd), y2: Y(meas.mean[i] + s * sd), stroke: ca, "stroke-width": 1.4 })));

      });

      const ov = el("rect", { x: p.l, y: p.t, width: pw, height: ph, fill: "transparent", style: "cursor:crosshair" });
      const ch = el("line", { x1: 0, x2: 0, y1: p.t, y2: p.t + ph, stroke: cm, "stroke-width": 1, opacity: 0 });
      svg.appendChild(ch); svg.appendChild(ov);
      ov.addEventListener("mousemove", ev => {

        ch.setAttribute("x1", sx); ch.setAttribute("x2", sx); ch.setAttribute("opacity", ".5");

    }

    /* ---- render ---- */
    let S, E;
    function render() {
      S = read(); if (!(S.d > 0)) S.d = 0.001;
      E = evalS(S);
      draw(S, E);
      const span = Math.abs(S.h1 - S.h2) || 1;
      const ok1 = Math.abs(E.solo1 - S.h1) <= 1.0;
      const okP = E.P <= S.pmax;
      $("kpi").innerHTML = [
        ["Max dev", fmt(E.md, 3), "Oe · " + fmt(E.md / span * 100, 2) + "%", "hi"],
        ["RMS dev", fmt(E.rms, 3), "Oe", ""],
        ["Nonlinearity", fmt(E.nl, 3), "Oe", ""],
        ["Gradient", fmt(E.fit.a / 100, 2), "Oe/cm", ""],
        ["H at x=0", fmt(E.ht[0], 2), "Oe", ""],
        ["H at x=d", fmt(E.ht[E.ht.length - 1], 2), "Oe", ""],
        ["Coil 1 alone", fmt(E.solo1, 2), "Oe", ok1 ? "ok" : "bad"],
        ["Coil 2 alone", fmt(E.solo2, 2), "Oe", ""],
        ["Resistance", fmt(E.R, 2), "Ω", ""],
        ["Voltage", fmt(E.V, 2), "V", ""],
        ["Power", fmt(E.P, 2), "W", okP ? "ok" : "bad"],
        ["Wire", fmt(E.L, 1), "m", ""]
      ].map(([k, v, u, c]) => `<div><div class="k">${k}</div><div class="v ${c}">${v}<s>${u}</s></div></div>`).join("");

      const step = Math.max(1, Math.round((E.xs.length - 1) / 20));
      let rows = "";
      for (let i = 0; i < E.xs.length; i += step) {
        rows += `<tr><td>${fmt(E.xs[i] * 1000, 1)}</td><td>${fmt(E.ht[i], 3)}</td><td>${fmt(E.h1[i], 3)}</td>
      <td>${fmt(E.h2[i], 3)}</td><td>${fmt(E.tg[i], 2)}</td><td>${fmt(E.ht[i] - E.tg[i], 3)}</td></tr>`;
      }
      $("prof").innerHTML = `<thead><tr><th>x (mm)</th><th>H total</th><th>H coil 1</th><th>H coil 2</th><th>Target</th><th>Dev</th></tr></thead><tbody>${rows}</tbody>`;
      if (meas) renderMeas();
      if (!$("t-sens").hidden) sens();
    }

    /* ---- optimizer ---- */
    const VARS = [
      { k: "r1", l: "r₁ (mm)", min: 20, max: 90, int: false },
      { k: "N1", l: "N₁", min: 20, max: 500, int: true },
      { k: "r2", l: "r₂ (mm)", min: 20, max: 90, int: false },
      { k: "N2", l: "N₂", min: 1, max: 500, int: true },
      { k: "d", l: "d (mm)", min: 30, max: 250, int: false }
    ];
    $("ov").querySelector("tbody").innerHTML = VARS.map(v => `<tr><td>${v.l}</td>
  <td><input type="checkbox" id="c_${v.k}" checked style="width:auto"></td>
  <td><input type="number" id="lo_${v.k}" value="${v.min}"></td>
  <td><input type="number" id="hi_${v.k}" value="${v.max}"></td></tr>`).join("");

    function cost(p, S0, mode, s2) {
      const r1 = p.r1 / 1000, r2 = p.r2 / 1000, d = p.d / 1000, N1 = Math.max(1, Math.round(p.N1)), N2 = Math.max(1, Math.round(p.N2));

    let bestP = null, running = false;
    function optimize() {

      const base = { r1: S0.r1 * 1000, N1: S0.N1, r2: S0.r2 * 1000, N2: S0.N2, d: S0.d * 1000 };

      const mk = v => { const o = { ...base }; act.forEach((a, i) => o[a.k] = a.int ? Math.round(v[i]) : v[i]); return o; };
      let pop, fit, di = 0, g = 0, bx = null, bf = Infinity, bd = dirs[0], ev = 0;
      const init = () => {

        const s2 = dirs[di];

          let a, b, c;
          do { a = Math.random() * NP | 0 } while (a === i); do { b = Math.random() * NP | 0 } while (b === i || b === a);
          do { c = Math.random() * NP | 0 } while (c === i || c === a || c === b);

          for (let j = 0; j < D; j++)tr[j] = (Math.random() < CR || j === jr) ? clamp(pop[a][j] + F * (pop[b][j] - pop[c][j]), lo[j], hi[j]) : pop[i][j];
          const f = cost(mk(tr), S0, mode, s2); ev++;
          if (f < fit[i]) { pop[i] = tr; fit[i] = f; }
          if (f < bf) { bf = f; bx = tr.slice(); bd = s2; }
        }
      };
      running = true; $("run").disabled = true; $("app").disabled = true; init();
      const t0 = performance.now();
      (function tick() {

        }
        $("pb").style.width = ((di + g / GENS) / dirs.length * 100).toFixed(1) + "%";
        $("log").textContent = `gen ${g}/${GENS} · best ${bf < 1e5 ? bf.toFixed(5) : "—"}`;

r1 = ${p.r1.toFixed(1)} mm   N1 = ${N1}   (alone ${Hc(0, N1, r1, S0.I).toFixed(2)} Oe)
r2 = ${p.r2.toFixed(1)} mm   N2 = ${N2}   (alone ${Hc(0, N2, r2, S0.I).toFixed(2)} Oe)  ${bd > 0 ? "Forward +" : "Reverse −"}
d  = ${p.d.toFixed(1)} mm
P  = ${P.toFixed(2)} W`;
      }
    }
    function applyOpt() {
      if (!bestP) return; const p = bestP.p;
      $("mode").value = "free";
      $("r1").value = p.r1.toFixed(1); $("n1").value = Math.round(p.N1);
      $("r2").value = p.r2.toFixed(1); $("n2").value = Math.round(p.N2);
      $("dist").value = p.d.toFixed(1); setDir(2, bestP.s2); render();
    }

    /* ---- sensitivity ---- */
    function sens() {
      const S0 = read(); const dr = +$("tr").value / 1000, dn = Math.round(+$("tn").value),
        dd = +$("td").value / 1000, ci = +$("ti").value / 100, dx = +$("tx").value / 1000;
      const f = (s, sh) => {
        const NP = 41, o = []; let md = 0;
        for (let i = 0; i < NP; i++) {
          const u = i / (NP - 1), x = u * s.d + (sh || 0);
          const h = s.s1 * Hc(x, s.N1, s.r1, s.I) + s.s2 * Hc(s.d - x, s.N2, s.r2, s.I);
          o.push(h); const e = h - (s.h1 + (s.h2 - s.h1) * u); if (Math.abs(e) > md) md = Math.abs(e);
        }
        return { a: o[0], m: o[20], b: o[40], md };
      };
      const base = f({ ...S0 });
      const rows = [];
      const add = (name, dlt, fp, fm) => {
        const p = { ...S0 }, m = { ...S0 }; let sp = 0, sm = 0;
        if (typeof fp === "number") { sp = fp; sm = fm; } else { fp(p); fm(m); }
        const A = f(p, sp), B = f(m, sm);
        rows.push([name, dlt, (A.a - B.a) / 2, (A.m - B.m) / 2, (A.b - B.b) / 2, Math.max(A.md, B.md) - base.md]);
      };
      add("r₁", `±${(dr * 1e3).toFixed(2)} mm`, s => s.r1 += dr, s => s.r1 -= dr);
      add("r₂", `±${(dr * 1e3).toFixed(2)} mm`, s => s.r2 += dr, s => s.r2 -= dr);
      add("N₁", `±${dn}`, s => s.N1 += dn, s => s.N1 = Math.max(1, s.N1 - dn));
      add("N₂", `±${dn}`, s => s.N2 += dn, s => s.N2 = Math.max(1, s.N2 - dn));
      add("d", `±${(dd * 1e3).toFixed(2)} mm`, s => s.d += dd, s => s.d -= dd);
      add("I", `±${(ci * 100).toFixed(1)} %`, s => s.I *= 1 + ci, s => s.I *= 1 - ci);
      add("probe x", `±${(dx * 1e3).toFixed(2)} mm`, dx, -dx);
      rows.sort((a, b) => Math.abs(b[3]) - Math.abs(a[3]));
      $("st").innerHTML = `<thead><tr><th>Param</th><th>Δ</th><th>ΔH x=0</th><th>ΔH mid</th><th>ΔH x=d</th><th>% at mid</th><th>Δ max dev</th></tr></thead><tbody>` +
        rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td>
      <td>${r[2] >= 0 ? "+" : ""}${fmt(r[2], 3)}</td><td>${r[3] >= 0 ? "+" : ""}${fmt(r[3], 3)}</td>
      <td>${r[4] >= 0 ? "+" : ""}${fmt(r[4], 3)}</td>
      <td><b>${fmt(Math.abs(r[3] / base.m * 100), 2)}%</b></td>
      <td>${r[5] >= 0 ? "+" : ""}${fmt(r[5], 3)}</td></tr>`).join("") + `</tbody>`;
    }

    /* ---- measurements ---- */
    function parse() {
      const txt = $("raw").value.trim();
      if (!txt) { meas = null; $("dn").textContent = ""; $("mt").innerHTML = ""; $("mk").innerHTML = ""; render(); return; }
      const map = new Map();
      txt.split(/\n+/).forEach(l => {
        const p = l.trim().split(/[\s,;\t]+/).map(Number).filter(v => !isNaN(v));
        if (p.length < 2) return;
        const x = +p[0].toFixed(4); if (!map.has(x)) map.set(x, []);
        for (let i = 1; i < p.length; i++)map.get(x).push(p[i]);
      });
      const ks = [...map.keys()].sort((a, b) => a - b);
      if (!ks.length) { meas = null; $("dn").textContent = "no numbers"; render(); return; }
      meas = { x: ks, mean: [], sd: [], n: [] };
      ks.forEach(k => {
        const v = map.get(k), n = v.length, mu = v.reduce((a, b) => a + b, 0) / n;
        meas.mean.push(mu); meas.n.push(n);
        meas.sd.push(n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mu) * (b - mu), 0) / (n - 1)) : 0);
      });
      const mn = Math.min(...meas.n);
      $("dn").innerHTML = `${ks.length} positions · ${mn}–${Math.max(...meas.n)} readings` + (mn < 3 ? ` <b style="color:var(--bad)">— under 3</b>` : "");
      render();
    }
    function renderMeas() {
      const xs = meas.x.map(v => v / 1000);
      const mdl = xs.map(x => S.s1 * Hc(x, S.N1, S.r1, S.I) + S.s2 * Hc(S.d - x, S.N2, S.r2, S.I));
      const pos = meas.sd.filter(v => v > 0), fl = pos.length ? Math.min(...pos) / 2 : 1;
      const ws = meas.sd.map(s => 1 / Math.pow(s > 0 ? s : fl, 2));
      const wf = lsq(xs, meas.mean, ws), uf = lsq(xs, meas.mean);
      let em = 0;
      const rows = meas.x.map((xm, i) => {
        const e = (meas.mean[i] - mdl[i]) / mdl[i] * 100; em = Math.max(em, Math.abs(e));
        return `<tr><td>${fmt(xm, 1)}</td><td>${meas.n[i]}</td><td>${fmt(meas.mean[i], 3)}</td>
      <td>${fmt(meas.sd[i], 3)}</td><td>${fmt(mdl[i], 3)}</td><td>${e >= 0 ? "+" : ""}${fmt(e, 2)}%</td></tr>`;
      }).join("");
      $("mt").innerHTML = `<thead><tr><th>x (mm)</th><th>n</th><th>Mean</th><th>STDEV</th><th>Model</th><th>vs model</th></tr></thead><tbody>${rows}</tbody>`;
      $("mk").innerHTML = [
        ["Wt. slope", fmt(wf.a / 100, 3), "Oe/cm"], ["Wt. R²", fmt(wf.r2, 5), ""],
        ["Unwt. slope", fmt(uf.a / 100, 3), "Oe/cm"], ["Mean STDEV", fmt(meas.sd.reduce((a, b) => a + b, 0) / meas.sd.length, 3), "Oe"],
        ["Max err vs model", fmt(em, 2), "%"]
      ].map(([k, v, u]) => `<div><div class="k">${k}</div><div class="v">${v}<s>${u}</s></div></div>`).join("");
    }

    /* ---- LM fit ---- */
    function solve(A, b) {
      const n = b.length, M = A.map((r, i) => [...r, b[i]]);
      for (let c = 0; c < n; c++) {
        let p = c; for (let r = c + 1; r < n; r++)if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        if (Math.abs(M[p][c]) < 1e-14) return null;[M[c], M[p]] = [M[p], M[c]];
        for (let r = 0; r < n; r++) { if (r === c) continue; const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++)M[r][k] -= f * M[c][k]; }
      }
      return M.map((r, i) => r[n] / r[i]);
    }
    function inv(A) {
      const n = A.length, M = A.map((r, i) => [...r, ...Array.from({ length: n }, (_, j) => i === j ? 1 : 0)]);
      for (let c = 0; c < n; c++) {
        let p = c; for (let r = c + 1; r < n; r++)if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        if (Math.abs(M[p][c]) < 1e-14) return null;[M[c], M[p]] = [M[p], M[c]];
        const d = M[c][c]; for (let k = 0; k < 2 * n; k++)M[c][k] /= d;
        for (let r = 0; r < n; r++) { if (r === c) continue; const f = M[r][c]; for (let k = 0; k < 2 * n; k++)M[r][k] -= f * M[c][k]; }
      }
      return M.map(r => r.slice(n));
    }
    const FS = [{ k: "k", id: "fk", l: "Amplitude k", u: "", dc: 4, dv: () => 1 },
    { k: "x0", id: "fx", l: "Probe zero x₀", u: "mm", dc: 3, dv: () => 0 },
    { k: "r1", id: "fr1", l: "r₁", u: "mm", dc: 2, dv: S => S.r1 * 1000 },
    { k: "d", id: "fd", l: "d", u: "mm", dc: 2, dv: S => S.d * 1000 }];
    function runFit() {
      if (!meas || meas.x.length < 3) { $("fn").textContent = "need ≥3 positions"; return; }
      const S0 = read(), act = FS.filter(f => $(f.id).checked), n = meas.x.length, m = act.length;
      if (!m) { $("fn").textContent = "select a parameter"; return; }
      if (n <= m) { $("fn").textContent = `need > ${m} positions`; return; }
      const dz = {}; FS.forEach(f => dz[f.k] = f.dv(S0));
      const wt = $("fw").checked, pos = meas.sd.filter(v => v > 0), fl = pos.length ? Math.min(...pos) / 2 : 1;
      const w = meas.sd.map(s => wt ? 1 / Math.pow(s > 0 ? s : fl, 2) : 1);
      const bld = v => { const P = { ...dz }; act.forEach((f, j) => P[f.k] = v[j]); return P; };
      const curve = v => {
        const P = bld(v);
        return meas.x.map(xm => {
          const x = (xm - P.x0) / 1000;
          return S0.s1 * Hc(x, S0.N1, P.r1 / 1000, S0.I * P.k) + S0.s2 * Hc(P.d / 1000 - x, S0.N2, S0.r2, S0.I * P.k);
        });
      };
      const chi = v => { const r = curve(v); let s = 0; for (let i = 0; i < n; i++) { const e = meas.mean[i] - r[i]; s += w[i] * e * e; } return s; };
      let p = act.map(f => dz[f.k]), c = chi(p), lam = 1e-3, it = 0, conv = false;
      const jac = v => {
        const J = Array.from({ length: n }, () => new Array(m).fill(0));
        for (let j = 0; j < m; j++) {
          const h = Math.max(1e-6, Math.abs(v[j]) * 1e-5);
          const a = v.slice(); a[j] += h; const ra = curve(a); const b = v.slice(); b[j] -= h; const rb = curve(b);
          for (let i = 0; i < n; i++)J[i][j] = (ra[i] - rb[i]) / (2 * h);
        } return J;
      };
      const nrm = (v, J) => {
        const r0 = curve(v), A = Array.from({ length: m }, () => new Array(m).fill(0)), b = new Array(m).fill(0);
        for (let i = 0; i < n; i++) {
          const e = meas.mean[i] - r0[i];
          for (let j = 0; j < m; j++) { b[j] += w[i] * e * J[i][j]; for (let k = 0; k < m; k++)A[j][k] += w[i] * J[i][j] * J[i][k]; }
        }
        return { A, b };
      };
      for (it = 0; it < 80; it++) {
        const J = jac(p), { A, b } = nrm(p, J); let st = false;
        for (let t = 0; t < 14; t++) {
          const Ad = A.map((r, j) => r.map((v, k) => k === j ? v * (1 + lam) : v)), dp = solve(Ad, b);
          if (!dp) { lam *= 10; continue; }
          const pn = p.map((v, j) => v + dp[j]), cn = chi(pn);
          if (isFinite(cn) && cn < c) { const rel = (c - cn) / Math.max(c, 1e-30); p = pn; c = cn; lam = Math.max(lam / 10, 1e-12); st = true; if (rel < 1e-10) conv = true; break; }
          lam *= 10; if (lam > 1e13) break;
        }
        if (!st) { conv = true; break; } if (conv) break;
      }
      const J = jac(p), { A } = nrm(p, J), IV = inv(A), dof = n - m, cr = c / dof;
      const se = IV ? act.map((f, j) => Math.sqrt(Math.max(0, IV[j][j] * cr))) : act.map(() => NaN);
      let worst = null;
      if (IV) for (let i = 0; i < m; i++)for (let j = i + 1; j < m; j++) {
        const r = IV[i][j] / Math.sqrt(Math.max(1e-300, IV[i][i] * IV[j][j]));
        if (!worst || Math.abs(r) > Math.abs(worst.r)) worst = { r, a: act[i].l, b: act[j].l };
      }
      const P = bld(p);
      fitR = {
        P, fn: xm => {
          const x = (xm - P.x0) / 1000;
          return S0.s1 * Hc(x, S0.N1, P.r1 / 1000, S0.I * P.k) + S0.s2 * Hc(P.d / 1000 - x, S0.N2, S0.r2, S0.I * P.k);
        }
      };
      const rs = meas.x.map((x, i) => meas.mean[i] - fitR.fn(x));
      const rms = Math.sqrt(rs.reduce((a, b) => a + b * b, 0) / n);
      $("ft").innerHTML = `<thead><tr><th>Param</th><th>Design</th><th>Fitted</th><th>Std err</th><th>Diff</th><th>Unit</th></tr></thead><tbody>` +
        FS.map(f => {
          const a = act.findIndex(x => x.k === f.k), on = a >= 0;
          return `<tr style="${on ? "" : "opacity:.45"}"><td>${f.l}${on ? "" : " (fixed)"}</td>
        <td>${dz[f.k].toFixed(f.dc)}</td><td><b>${P[f.k].toFixed(f.dc)}</b></td>
        <td>${on && isFinite(se[a]) ? "± " + se[a].toFixed(f.dc) : "—"}</td>
        <td>${(P[f.k] - dz[f.k]) >= 0 ? "+" : ""}${(P[f.k] - dz[f.k]).toFixed(f.dc)}</td><td>${f.u}</td></tr>`;
        }).join("") + `</tbody>`;
      $("fn").innerHTML = `${it + 1} iter · ${conv ? "converged" : "max iter"} · dof ${dof} · residual RMS <b>${fmt(rms, 4)} Oe</b> · χ²/ν <b>${fmt(cr, 3)}</b>` +
        (worst ? ` · max |ρ| <b style="color:${Math.abs(worst.r) > 0.9 ? "var(--bad)" : "var(--good)"}">${Math.abs(worst.r).toFixed(3)}</b> (${worst.a}↔${worst.b})` : "");
      render();
    }

    /* ---- misc ---- */
    function setDir(i, v) { dir[i] = v; $("d" + i).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", (+b.dataset.v === v) + "")); }
    function summary() {
      return `Gradient Coil Bench
I = ${S.I} A   wire ${(S.dw * 1000).toFixed(1)} mm
Coil 1: r ${(S.r1 * 1000).toFixed(1)} mm, N ${S.N1}, ${S.s1 > 0 ? "fwd" : "rev"}, alone ${E.solo1.toFixed(2)} Oe
Coil 2: r ${(S.r2 * 1000).toFixed(1)} mm, N ${S.N2}, ${S.s2 > 0 ? "fwd" : "rev"}, alone ${E.solo2.toFixed(2)} Oe
d = ${(S.d * 1000).toFixed(1)} mm   target ${S.h1} -> ${S.h2} Oe
H(0) = ${E.ht[0].toFixed(2)}   H(d) = ${E.ht[E.ht.length - 1].toFixed(2)} Oe
max dev ${E.md.toFixed(3)} Oe (${(E.md / Math.abs(S.h1 - S.h2) * 100).toFixed(2)}%)   RMS ${E.rms.toFixed(3)}   nonlin ${E.nl.toFixed(3)}
gradient ${(E.fit.a / 100).toFixed(2)} Oe/cm
R ${E.R.toFixed(2)} ohm   V ${E.V.toFixed(2)}   P ${E.P.toFixed(2)} W   wire ${E.L.toFixed(1)} m`;
    }
    async function copy(t, b) { try { await navigator.clipboard.writeText(t); const o = b.textContent; b.textContent = "Copied"; setTimeout(() => b.textContent = o, 1100); } catch (e) { b.textContent = "Failed"; } }

    ["cur", "dw", "dist", "pmax", "mode", "r1", "n1", "r2", "n2", "h1", "h2"].forEach(i => $(i).addEventListener("input", render));
    ["sep", "shm"].forEach(i => $(i).addEventListener("change", render));
    [1, 2].forEach(i => $("d" + i).addEventListener("click", e => { const b = e.target.closest("button"); if (b) { setDir(i, +b.dataset.v); render(); } }));
    document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach(o => o.setAttribute("aria-selected", (o === b) + ""));
      ["calc", "opt", "sens", "meas"].forEach(t => $("t-" + t).hidden = (t !== b.dataset.t));
      if (b.dataset.t === "sens") sens();
    }));
    $("run").addEventListener("click", () => { $("log").textContent = "running…"; setTimeout(optimize, 20); });
    $("app").addEventListener("click", applyOpt);
    ["tr", "tn", "td", "ti", "tx"].forEach(i => $(i).addEventListener("input", () => { if (!$("t-sens").hidden) sens(); }));
    $("pr").addEventListener("click", parse);
    $("cl").addEventListener("click", () => { $("raw").value = ""; parse(); });
    $("rf").addEventListener("click", () => { $("fn").textContent = "fitting…"; setTimeout(runFit, 20); });
    $("cf").addEventListener("click", () => { fitR = null; $("ft").innerHTML = ""; $("fn").textContent = ""; render(); });
    $("cps").addEventListener("click", e => copy(summary(), e.target));
    $("cpt").addEventListener("click", e => {
      const L = ["x_mm\tH_total\tH_coil1\tH_coil2\ttarget\tdev"];
      E.xs.forEach((x, i) => L.push([(x * 1000).toFixed(2), E.ht[i].toFixed(4), E.h1[i].toFixed(4), E.h2[i].toFixed(4), E.tg[i].toFixed(3), (E.ht[i] - E.tg[i]).toFixed(4)].join("\t")));
      copy(L.join("\n"), e.target);
    });
    $("tb").addEventListener("click", () => {
      const c = document.documentElement.getAttribute("data-theme");
      const d = c ? c === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", d ? "light" : "dark"); render();
    });

    render(); parse();
  </script>
</body>
